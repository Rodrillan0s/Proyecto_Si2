<form (ngSubmit)="guardar()" #incForm="ngForm" class="space-y-5">

  <div *ngIf="error" class="rounded-lg border border-rose-300 bg-rose-50 dark:bg-rose-950/40 dark:border-rose-800 px-4 py-3 text-sm text-rose-700 dark:text-rose-300">
    {{ error }}
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

    <!-- PROYECTO / OBRA -->
    <div class="sm:col-span-2" *ngIf="!editando">
      <label for="inc-obra" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">
        Proyecto / Obra *
      </label>
      <select
        id="inc-obra"
        name="id_obra"
        [(ngModel)]="form.id_obra"
        (ngModelChange)="onCambiarObra()"
        required
        [disabled]="cargandoProyectos"
        class="w-full px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500 disabled:opacity-50"
      >
        <option [ngValue]="null" disabled>{{ cargandoProyectos ? 'Cargando proyectos...' : 'Seleccione un proyecto' }}</option>
        <option *ngFor="let p of proyectos" [ngValue]="p.id_obra">{{ p.codigo }} · {{ p.nombre }}</option>
      </select>
    </div>

    <!-- PROYECTO (solo lectura al editar: el backend no permite moverlo de obra) -->
    <div class="sm:col-span-2" *ngIf="editando">
      <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Proyecto / Obra</label>
      <div class="w-full px-3 py-2.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 text-sm text-slate-600 dark:text-slate-300">
        {{ incidencia?.obra_codigo }} · {{ incidencia?.obra_nombre }}
      </div>
    </div>

    <!-- UNIDAD DE CONSTRUCCION (opcional) -->
    <div class="sm:col-span-2" *ngIf="!editando">
      <label for="inc-unidad" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">
        Unidad de construcción (opcional)
      </label>
      <select
        id="inc-unidad"
        name="id_unidad"
        [(ngModel)]="form.id_unidad"
        [disabled]="!form.id_obra || cargandoUnidades"
        class="w-full px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500 disabled:opacity-50"
      >
        <option [ngValue]="null">{{ !form.id_obra ? 'Seleccione un proyecto primero' : (cargandoUnidades ? 'Cargando unidades...' : 'Sin unidad específica') }}</option>
        <option *ngFor="let u of unidades" [ngValue]="u.id_unidad">{{ u.codigo }} · {{ u.nombre }}</option>
      </select>
    </div>

    <div class="sm:col-span-2" *ngIf="editando && incidencia?.unidad_codigo">
      <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Unidad de construcción</label>
      <div class="w-full px-3 py-2.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 text-sm text-slate-600 dark:text-slate-300">
        {{ incidencia?.unidad_codigo }}
      </div>
    </div>

    <!-- UBICACION (opcional) -->
    <div class="sm:col-span-2">
      <label for="inc-ubicacion" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Ubicación (opcional)</label>
      <input
        id="inc-ubicacion"
        name="ubicacion"
        type="text"
        [(ngModel)]="form.ubicacion"
        maxlength="255"
        placeholder="Ej.: Bloque 1, pared norte del piso 2"
        class="w-full px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500"
      >
    </div>

    <!-- TITULO -->
    <div class="sm:col-span-2">
      <label for="inc-titulo" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Título *</label>
      <input
        id="inc-titulo"
        name="titulo"
        type="text"
        [(ngModel)]="form.titulo"
        required
        maxlength="200"
        placeholder="Ej.: Grieta visible en muro perimetral"
        class="w-full px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500"
      >
    </div>

    <!-- DESCRIPCION -->
    <div class="sm:col-span-2">
      <label for="inc-descripcion" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Descripción *</label>
      <textarea
        id="inc-descripcion"
        name="descripcion"
        [(ngModel)]="form.descripcion"
        required
        rows="4"
        placeholder="Describe con detalle la incidencia observada en obra..."
        class="w-full px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500 resize-y"
      ></textarea>
    </div>

    <!-- PRIORIDAD -->
    <div class="sm:col-span-2">
      <label for="inc-prioridad" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Prioridad *</label>
      <select
        id="inc-prioridad"
        name="prioridad"
        [(ngModel)]="form.prioridad"
        required
        class="w-full px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500"
      >
        <option value="" disabled>Seleccione una prioridad</option>
        <option *ngFor="let p of prioridades" [value]="p">{{ p }}</option>
      </select>
    </div>

  </div>

  <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100 dark:border-slate-800">
    <button type="button" (click)="cancelar()" [disabled]="guardando"
      class="px-4 py-2 text-xs font-bold rounded-lg text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition disabled:opacity-50">
      Cancelar
    </button>
    <button type="submit" [disabled]="guardando || incForm.invalid"
      class="inline-flex items-center gap-2 px-4 py-2 text-xs font-bold rounded-lg bg-amber-600 hover:bg-amber-700 text-white transition shadow-xs disabled:opacity-50">
      <svg *ngIf="guardando" class="animate-spin h-3.5 w-3.5" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
      </svg>
      {{ guardando ? 'Guardando...' : (editando ? 'Guardar cambios' : 'Registrar incidencia') }}
    </button>
  </div>
</form>
