<text x="950.0" y="232.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#000000">Asignar código único (RFI)</text>
<text x="950.0" y="245.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#000000">y notificar al especialista</text>
