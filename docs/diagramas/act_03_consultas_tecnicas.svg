<text x="675.0" y="502.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#000000">Redactar dictamen técnico</text>
<text x="675.0" y="515.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#000000">y adjuntar plano aclaratorio</text>
