<text x="570.0" y="322.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#000000">Examinar antecedentes,</text>
<text x="570.0" y="335.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#000000">planos base y memorias</text>
