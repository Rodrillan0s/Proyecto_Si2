<text x="180.0" y="234.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#000000">Registrar consulta técnica,</text>
<text x="180.0" y="247.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#000000">adjuntar fotos y fijar urgencia</text>
