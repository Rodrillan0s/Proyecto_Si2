<text x="570.0" y="366" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" fill="#000000">¿Modifica diseño</text>
<text x="570.0" y="378" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" fill="#000000">o presupuesto?</text>
<rect x="400" y="480" width="170" height="50" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="1.3"/>
<text x="485.0" y="502.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#000000">Elaborar orden de cambio</text>
<text x="485.0" y="515.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#000000">y convocar a comité de costos</text>
